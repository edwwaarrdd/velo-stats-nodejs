x-app: &app
  build: .
  environment:
    NODE_ENV: production
    PORT: 8000
    TZ: UTC
    DB_DATABASE: /app/database/database.sqlite
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  volumes:
    - .:/app
    # Keep the dependencies and the build installed in the image rather than the host's.
    - /app/node_modules
    - /app/dist
  depends_on:
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: ["node", "dist/main.js"]
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/_healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["node", "dist/worker.js", "default"]

  worker-ride-distance:
    <<: *app
    command: ["node", "dist/worker.js", "ride_distance_checks"]

  worker-ride-weather:
    <<: *app
    command: ["node", "dist/worker.js", "ride_weather_checks"]
